<div class="container mt-4" *ngIf="user; else notLogged">
    <h1>Profile</h1>
  
    <form (ngSubmit)="save()" class="mt-3" #formRef="ngForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" [(ngModel)]="user.username" name="username" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Birthdate</label>
        <input type="date" class="form-control" [(ngModel)]="user.birthdate" name="birthdate">
      </div>
  
      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" class="form-control" [(ngModel)]="user.age" name="age" min="0">
      </div>
  
      <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">Save</button>
      <span *ngIf="saved" class="ms-2 text-success">Saved!</span>
    </form>
  
    <hr class="my-4">
  
    <h5 class="mb-2">Preview</h5>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Valid user:</strong> {{ user.valid }}</p>
  
    <div class="mt-3">
      <img src="https://images.unsplash.com/photo-1623880840102-7df0a9f3545b?fm=jpg&q=60&w=3000"
      alt="Profile image"
      class="img-fluid rounded shadow-sm"
      style="max-width: 200px; height: auto;">
    </div>
  </div>
  
  <ng-template #notLogged>
    <p class="mt-4">Not logged in. Redirecting to login…</p>
  </ng-template>
